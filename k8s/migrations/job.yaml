apiVersion: batch/v1
kind: Job
metadata:
  name: rag-migrations
  labels:
    app: rag-app
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: rag-app
    spec:
      restartPolicy: OnFailure
      serviceAccountName: rag-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: rag-app:sha256-placeholder
          command: [node, apps/api/dist/migrate.js]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-app-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
