apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts: [rag.localhost]
    secretName: rag-app-tls
  rules:
  - host: rag.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rag-app
            port:
              number: 80
